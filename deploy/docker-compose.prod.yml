# Production-style stack for sharing the Load Control Center.
# Usage: cp deploy/.env.example deploy/.env && edit secrets, then:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-traffic}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published — only reachable on the internal network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: /usr/local/bin/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-traffic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traffic}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      HTTP_ADDR: ":8080"
      SIMULATION_BASE_URL: http://127.0.0.1:8080
      LOADTEST_JOBS_DIR: /loadtest/jobs
      LOADTEST_RESULTS_DIR: /loadtest/results
      DEMO_AUTO_SETUP: ${DEMO_AUTO_SETUP:-true}
      LOADTEST_MAX_VUS: ${LOADTEST_MAX_VUS:-150}
      LOADTEST_MAX_QUEUE: ${LOADTEST_MAX_QUEUE:-3}
      LOADTEST_MAX_CONCURRENT: ${LOADTEST_MAX_CONCURRENT:-1}
      LOADTEST_MAX_STEADY_SEC: ${LOADTEST_MAX_STEADY_SEC:-90}
      LOADTEST_DEFAULT_VUS: ${LOADTEST_DEFAULT_VUS:-80}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-40}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - loadtest_jobs:/loadtest/jobs
      - loadtest_results:/loadtest/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: /usr/local/bin/worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-traffic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traffic}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  loadtest-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.loadtest-runner
    restart: unless-stopped
    user: "0:0"
    environment:
      BASE_URL: http://api:8080
      ADMIN_KEY: ${ADMIN_API_KEY}
      LOADTEST_JOBS_DIR: /loadtest/jobs
      LOADTEST_RESULTS_DIR: /loadtest/results
      K6_SCRIPTS_DIR: /scripts
    volumes:
      - ../scripts/traffic:/scripts:ro
      - loadtest_jobs:/loadtest/jobs
      - loadtest_results:/loadtest/results
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  loadtest_jobs:
  loadtest_results:
